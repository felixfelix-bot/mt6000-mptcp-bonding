---
# Multi-WAN MPTCP bonding for GL-MT6000 / OpenWrt 25.12.
#
#   ansible-playbook -i inventory/hosts.yml playbook.yml --check
#   ansible-playbook -i inventory/hosts.yml playbook.yml
#
# Revert:  -e state=absent
#
# Prereq: `ssh <inventory host>` works (docs/ACCESS.md) and python3 is on the
#         target (the common role installs it if missing).

- name: Bond the MT6000's WAN with a wireless STA uplink
  hosts: mt6000
  gather_facts: false

  tasks:
    - name: Validate the selected mode
      ansible.builtin.assert:
        that: uplink_mode in ['mptcp', 'mwan3']
        fail_msg: "uplink_mode must be mptcp or mwan3"

    - name: Reconcile shell access from group_vars (public keys only)
      ansible.builtin.include_tasks: roles/access/tasks/main.yml
      tags: [access]

    - name: Validate mwan3 settings before touching the router
      ansible.builtin.include_tasks: roles/mwan3/tasks/validate.yml
      when: uplink_mode == 'mwan3' and (state | default('present')) == 'present'

    - name: Detect package era for mwan3 before any provisioning
      ansible.builtin.raw: |
        if command -v apk >/dev/null 2>&1; then echo apk;
        elif command -v opkg >/dev/null 2>&1; then echo ipk;
        else echo unknown; exit 1; fi
      register: mwan3_era
      changed_when: false
      when: uplink_mode == 'mwan3' and (state | default('present')) == 'present'

    - name: Fail fast when the package repo cannot satisfy mwan3
      ansible.builtin.raw: |
        apk add --simulate mwan3 >/tmp/mwan3-sim.log 2>&1 || {
          echo "MWAN3_UNINSTALLABLE"; grep -E 'no such package|required by' /tmp/mwan3-sim.log; exit 1; }
      register: mwan3_sim
      failed_when: mwan3_sim.rc != 0
      changed_when: false
      when:
        - uplink_mode == 'mwan3'
        - (state | default('present')) == 'present'
        - mwan3_era.stdout | default('') | trim == 'apk'

    - name: Warn loudly on unsupported ipk era
      ansible.builtin.debug:
        msg: "WARNING: mwan3 mode SKIPPED: ipk/opkg firmware is unsupported; no configuration was changed."
      when: mwan3_era.stdout | default('') | trim == 'ipk'

    - name: End this host cleanly on ipk era
      ansible.builtin.meta: end_host
      when: mwan3_era.stdout | default('') | trim == 'ipk'

    - name: Ensure credentials are supplied (they are never committed)
      ansible.builtin.assert:
        that:
          - uplink_mode != 'mptcp' or (mptcp_server_password | length > 0 and mptcp_server_password != 'CHANGEME')
          - (not (wwan_enabled | bool)) or (wwan_key | length > 0 and wwan_key != 'CHANGEME')
        fail_msg: >-
          Credentials are NOT stored in this repo. Supply them at run time:
          export TG_MPTCP_PASSWORD='...'  (remote de-aggregation server)
          export TG_WWAN_KEY='...'        (wireless uplink PSK)
          ...or pass -e mptcp_server_password=... -e wwan_key=...
        success_msg: "credentials supplied"
      when: (state | default('present')) == 'present'

    - name: Preflight — reachability + python3
      ansible.builtin.raw: |
        test -x /usr/bin/python3 || apk add python3 >/dev/null 2>&1
        /usr/bin/python3 -c 'print("python-ok")'
      changed_when: false
      register: preflight
      when: uplink_mode == 'mptcp'
      failed_when: "'python-ok' not in preflight.stdout"

    - name: Detect the automations that reconcile our config
      ansible.builtin.raw: |
        for s in tollgate-wrt mwan3; do
          if [ -x /etc/init.d/$s ]; then
            /etc/init.d/$s running >/dev/null 2>&1 && echo "$s=running" || echo "$s=stopped"
          fi
        done
      changed_when: false
      register: reconcilers

    - name: Warn when a reconciler owns /etc/config/wireless
      ansible.builtin.debug:
        msg: >-
          NOTE: {{ reconcilers.stdout_lines | join(' ') }}.
          tollgate-wrt rewrites /etc/config/wireless — if the STA section
          disappears after a while, stop it during provisioning with
          -e stop_tollgate=true, or accept it as the managed owner.
      when: "'running' in reconcilers.stdout"

    - name: Stop TollGate's reconciler during provisioning (opt-in)
      ansible.builtin.raw: /etc/init.d/tollgate-wrt stop
      when: stop_tollgate | default(false) | bool
      changed_when: true

    - name: Require explicit teardown before switching routing engines
      ansible.builtin.raw: |
        {% if uplink_mode == 'mwan3' %}
        if [ -x {{ mptcp_init_path | quote }} ] && {{ mptcp_init_path | quote }} enabled; then
          echo 'Run -e state=absent before switching from MPTCP to mwan3'; exit 1
        fi
        {% else %}
        if [ -d /etc/mt6000-mwan3-backup ] && [ -x /etc/init.d/mwan3 ] && /etc/init.d/mwan3 enabled; then
          echo 'Stop and tear down mwan3 before enabling MPTCP'; exit 1
        fi
        {% endif %}
        echo MODE_OK
      changed_when: false
      when: (state | default('present')) == 'present'

    - name: Apply roles
      ansible.builtin.include_role:
        name: "{{ role_name }}"
      loop: "{{ ['common', 'uplinks', 'bond', 'proxy', 'steering'] if uplink_mode == 'mptcp' else ['common', 'uplinks', 'mwan3'] }}"
      loop_control:
        loop_var: role_name
      when: (state | default('present')) == 'present'

    - name: Revert the bond
      ansible.builtin.include_role:
        name: teardown
      when: (state | default('present')) == 'absent'

    - name: Report the resulting bond
      ansible.builtin.raw: |
        echo "--- uplinks ---"; ip -br -4 addr | grep -vE ' lo |br-|docker'
        {% if uplink_mode == 'mptcp' %}
        echo "--- mptcp endpoints ---"; ip mptcp endpoint show 2>/dev/null
        {% else %}
        echo "--- mwan3 ---"; mwan3 status
        {% endif %}
        echo "--- defaults ---"; ip route | grep default
      changed_when: false
      register: report
      when: (state | default('present')) == 'present' and not ansible_check_mode

    - name: Bond status
      ansible.builtin.debug:
        msg: "{{ report.stdout_lines }}"
      when: (state | default('present')) == 'present' and not ansible_check_mode
