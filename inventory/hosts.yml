# The bond is configured on the router itself.
# Target selection is environment-driven so the same inventory serves the
# production box and the bench unit without editing tracked files:
#
#   MT6000_HOST=vil4                        (default; an ~/.ssh/config Host)
#   MT6000_HOST=192.168.50.1 MT6000_KEY=~/.ssh/id_ed25519   (bench)
#
# See docs/ACCESS.md — `ssh <ansible_host>` must work before running Ansible.
all:
  hosts:
    mt6000:
      ansible_host: "{{ lookup('env', 'MT6000_HOST') | default('vil4', true) }}"
      ansible_user: root
      ansible_connection: ssh
      ansible_ssh_private_key_file: "{{ lookup('env', 'MT6000_KEY') | default('', true) }}"
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
      # OpenWrt has no python by default; use raw shell so roles never need a
      # python interpreter on target.
      ansible_python_interpreter: auto_silent
