# The bond is configured on the router itself.
# Adjust ansible_host / ProxyJump to match how you reach your box
# (see docs/ACCESS.md — `ssh <name>` must work before running Ansible).
all:
  hosts:
    mt6000:
      ansible_host: vil4          # an ~/.ssh/config Host with ProxyJump set
      ansible_user: root
      ansible_connection: ssh
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no
        -o UserKnownHostsFile=/dev/null
      # OpenWrt has no python by default; use raw shell so roles never need a
      # python interpreter on target.
      ansible_python_interpreter: auto_silent
