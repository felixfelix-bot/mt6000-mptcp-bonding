---
# Reconcile per-client routing-table rules. Fail-closed and self-limiting:
#   * every declared table must already exist (uci network.<iface>.ip4table)
#   * every client must name a declared objective
#   * only rules inside [pref_base, pref_base+span] are added or removed
#   * the post-condition is read back from the kernel, not from the play recap

- name: Validate inputs
  ansible.builtin.assert:
    that:
      - client_tables_objectives | length > 0
      - client_tables_pref_base | int >= 1000
      - client_tables_pref_span | int >= (client_tables_clients | length) + 1
    fail_msg: "pref_base must be >= 1000 and pref_span must cover the client count"

- name: Every client must name a declared objective
  ansible.builtin.assert:
    that: item.objective in client_tables_objectives
    fail_msg: "client {{ item.ip }} names unknown objective {{ item.objective }}"
  loop: "{{ client_tables_clients | default([]) }}"
  loop_control:
    label: "{{ item.ip }}"

- name: Declared tables must match what uci pins for an uplink
  ansible.builtin.raw: |
    set -eu
    {% for obj, spec in client_tables_objectives.items() %}
    {% if spec.table | string != 'main' %}
    hit=0
    for i in wan3 wwan wan1 wan2 wan4 eth1; do
      t=$(uci -q get network.$i.ip4table || true)
      [ "$t" = "{{ spec.table }}" ] && { hit=1; break; }
    done
    [ "$hit" = 1 ] || { echo "DRIFT: {{ obj }} wants table {{ spec.table }}, which no network.<iface>.ip4table declares"; exit 1; }
    {% endif %}
    {% endfor %}
  changed_when: false

- name: Declared tables must have a default route
  ansible.builtin.raw: |
    set -eu
    {% for obj, spec in client_tables_objectives.items() %}
    {% if spec.table | string != 'main' %}
    ip route show table {{ spec.table }} | grep -q '^default' || { echo "NO_DEFAULT: table {{ spec.table }} ({{ obj }})"; exit 1; }
    {% endif %}
    {% endfor %}
  changed_when: false

- name: Reconcile rules in the owned preference band
  ansible.builtin.raw: |
    set -eu
    BASE={{ client_tables_pref_base | int }}
    TOP=$(( BASE + {{ client_tables_pref_span | int }} ))
    desired=/tmp/ct-desired.$$
    : > "$desired"
    {% for c in (client_tables_clients | default([]) | sort(attribute='ip')) %}
    {% set table = client_tables_objectives[c.objective].table | string %}
    {% if table != 'main' %}
    {% for cidr in (client_tables_local_exempt_cidrs | default([])) %}
    echo "{{ client_tables_pref_base | int + 100 + loop.index0 }}|from {{ c.ip }} to {{ cidr }}|lan" >> "$desired"
    {% endfor %}
    echo "{{ client_tables_pref_base | int + loop.index0 }}|from {{ c.ip }}|{{ table }}" >> "$desired"
    {% endif %}
    {% endfor %}

    changed=0
    while IFS='|' read -r pref match table; do
      [ -n "${pref:-}" ] || continue
      if ip rule list | grep -qE "^${pref}:[[:space:]]+${match} lookup ${table}\$"; then
        continue
      fi
      ip rule del pref "$pref" 2>/dev/null || true
      # shellcheck disable=SC2086  # match is generated by this template
      ip rule add pref "$pref" $match lookup "$table"
      changed=$(( changed + 1 ))
    done < "$desired"

    for p in $(ip rule list | awk -v a="$BASE" -v b="$TOP" '{p=$1; sub(":","",p); if (p+0>=a+0 && p+0<=b+0) print p+0}' | sort -u); do
      keep=0
      while IFS='|' read -r dp _rest; do
        [ "${dp:-}" = "$p" ] && keep=1
      done < "$desired"
      if [ "$keep" = 0 ]; then
        ip rule del pref "$p" || true
        changed=$(( changed + 1 ))
      fi
    done
    rm -f "$desired"
    echo "CLIENT_TABLES_CHANGED=$changed"
  register: ct_reconcile
  changed_when: "'CLIENT_TABLES_CHANGED=0' not in ct_reconcile.stdout"

- name: Read the band back from the kernel
  ansible.builtin.raw: |
    ip rule list | awk -v a={{ client_tables_pref_base | int }} -v b=$(( {{ client_tables_pref_base | int }} + {{ client_tables_pref_span | int }} )) '{p=$1; sub(":","",p); if (p+0>=a+0 && p+0<=b+0) print}'
  register: ct_readback
  changed_when: false

- name: Post-condition — every steered client is in the kernel with its table
  ansible.builtin.assert:
    that:
      - ct_readback.stdout is search('from ' + item.ip + ' lookup ' + (client_tables_objectives[item.objective].table | string))
    fail_msg: "{{ item.ip }} is not steered to table {{ client_tables_objectives[item.objective].table }}"
  loop: "{{ client_tables_clients | default([]) }}"
  loop_control:
    label: "{{ item.ip }} -> {{ item.objective }}"
  when: client_tables_objectives[item.objective].table | string != 'main'

- name: Report
  ansible.builtin.debug:
    msg: "{{ ct_readback.stdout_lines | default([]) }}"
