---
- name: Provision the original MPTCP toolchain and tunables
  ansible.builtin.include_tasks: mptcp.yml
  when: uplink_mode == 'mptcp'

- name: Explain the mwan3 common baseline
  ansible.builtin.debug:
    msg: "mwan3 uses the existing OpenWrt network/firewall; no MPTCP packages or sysctls are applied."
  when: uplink_mode == 'mwan3'
